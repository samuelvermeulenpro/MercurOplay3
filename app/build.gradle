plugins {
    id 'com.android.application'
}

// Release signing (Play Store upload key): read from keystore.properties at the project
// root - never committed, see keystore.properties.sample. Without it, release builds
// fall back to the debug key (fine locally, rejected by the Play Store).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = 'fr.svpro.radiomercure'
    compileSdk = 37

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId = "fr.svpro.radiomercure"
        minSdk = 24
        targetSdk = 37
        versionCode = 3210
        versionName = "3.2.1"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // java.time (programme grid) on API 24-25.
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.10.2'
    implementation 'androidx.navigation:navigation-ui:2.10.2'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.1'

    // Media3 (ExoPlayer + Session) - handles Icecast/ICY streams and video playback
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-common:1.11.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.11.1'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    // TLS 1.3 provider: Android only enables TLS 1.3 by default from API 29 (Android 10).
    // Below that (our minSdk is 24), a server that requires/prefers TLS 1.3 fails the
    // handshake entirely without this - see PeerTubeApiClient/MercurOplayApp for where
    // it's installed.
    implementation 'org.conscrypt:conscrypt-android:2.9.0'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:5.0.10'

    // Google Play In-App Updates
    implementation 'com.google.android.play:app-update:2.1.0'

    // Swipe to refresh for PeerTube lists
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
}
